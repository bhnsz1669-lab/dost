<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه دوست یابی</title>
    <style>
        /* استایل پایه - رنگ پس‌زمینه آبی ملایم */
        body { 
            font-family: Tahoma, sans-serif; 
            background-color: #A4BCE0; 
            margin: 0; 
            padding: 20px; 
            color: #111; 
            transition: 0.4s;
        }
        
        /* حالت شب (Dark Mode) */
        body.dark-mode { background-color: #1a1a1a; color: #f1f1f1; }
        body.dark-mode .chat-box { background-color: #2d2d2d; color: #fff; }
        body.dark-mode .empty-state { color: #ccc; }

        /* هدر */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 10px 0; }
        
        .setting-icon { font-size: 1.5rem; color: white; cursor: pointer; width: 40px; text-align: center; }
        .title { font-size: 1.5rem; font-weight: bold; text-align: center; color: #111; flex-grow: 1; }
        body.dark-mode .title { color: #fff; }
        
        .shopping-icon-container { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .shopping-icon-svg { width: 32px; height: 32px; fill: white; }

        /* لیست کاربران */
        .user-list { display: flex; flex-direction: row; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .user-list::-webkit-scrollbar { display: none; }
        
        .user-item { flex: 0 0 auto; text-align: center; position: relative; width: 65px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .user-item:hover { transform: scale(1.1); }
        
        .avatar { width: 65px; height: 65px; border-radius: 50%; background-color: #ddd; object-fit: cover; border: 2px solid white; }
        .online-dot { width: 14px; height: 14px; background: #2ecc71; border-radius: 50%; position: absolute; bottom: 20px; right: 5px; border: 3px solid white; }
        .name { font-size: 0.85rem; margin-top: 5px; color: #111; }
        body.dark-mode .name { color: #eee; }

        /* پیام مرکزی */
        .empty-state { text-align: center; margin-top: 100px; color: #111; }
        
        /* مودال چت */
        .chat-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .chat-box { background: white; width: 85%; max-width: 350px; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .chat-input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; }
        .btn-send { background: #555; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .theme-btn { cursor: pointer; background: #555; color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <div class="setting-icon">⚙️</div>
        <div class="title">دوست یابی</div>
        <div class="shopping-icon-container">
            <button class="theme-btn" onclick="document.body.classList.toggle('dark-mode')">🌙 تم</button>
        </div>
    </div>

    <div class="user-list">
        <div class="user-item" onclick="openChat('نیکا')"><img class="avatar" src="user1.jpg"><div class="online-dot"></div><div class="name">نیکا</div></div>
        <div class="user-item" onclick="openChat('نازنین')"><img class="avatar" src="user2.jpg"><div class="online-dot"></div><div class="name">نازنین</div></div>
        <div class="user-item" onclick="openChat('علی رضا')"><img class="avatar" src="user3.jpg"><div class="online-dot"></div><div class="name">علی رضا</div></div>
        <div class="user-item" onclick="openChat('بهناز')"><img class="avatar" src="user4.jpg"><div class="online-dot"></div><div class="name">بهناز</div></div>
        <div class="user-item" onclick="openChat('رضا')"><img class="avatar" src="user5.jpg"><div class="online-dot"></div><div class="name">رضا</div></div>
        <div class="user-item" onclick="openChat('سارا')"><img class="avatar" src="user6.jpg"><div class="online-dot"></div><div class="name">سارا</div></div>
        <div class="user-item" onclick="openChat('امیر')"><img class="avatar" src="user7.jpg"><div class="online-dot"></div><div class="name">امیر</div></div>
    </div>

    <div class="empty-state">
        <h2>هنوز با کسی چت نکردی</h2>
        <p>به کاربرای آنلاین پیام بده<br>چت‌هات اینجا میتونی ببینی</p>
    </div>

    <div id="chatModal" class="chat-modal">
        <div class="chat-box">
            <h2 id="chatName">چت</h2>
            <input type="text" class="chat-input" placeholder="پیام خود را بنویسید...">
            <button class="btn-send" onclick="document.getElementById('chatModal').style.display='none'">ارسال</button>
        </div>
    </div>

    <script>
        function openChat(name) {
            document.getElementById('chatModal').style.display = 'flex';
            document.getElementById('chatName').innerText = 'گفتگو با ' + name;
        }
    </script>

</body>
</html>
