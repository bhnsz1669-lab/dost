<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به اپلیکیشن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* لوگو یا عنوان بالا */
        .header-logo { text-align: center; padding: 40px 0; font-size: 1.5rem; font-weight: bold; }
        
        /* بدنه اصلی فرم */
        .register-box { padding: 0 30px; flex-grow: 1; }
        
        /* بخش پروفایل */
        .profile-pic { width: 100px; height: 100px; background: #333; border-radius: 50%; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px dashed #555; }
        
        /* اینپوت‌ها */
        .input-wrapper { border-bottom: 2px solid #555; padding: 10px 0; margin-bottom: 20px; display: flex; align-items: center; }
        .input-wrapper input { background: transparent; border: none; color: #fff; padding: 5px; width: 100%; font-size: 1rem; text-align: left; }
        .prefix { color: #888; margin-left: 10px; }
        
        /* دکمه ارسال */
        .fab-btn { width: 60px; height: 60px; background: #d87093; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: fixed; bottom: 30px; left: 30px; cursor: pointer; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .fab-btn svg { fill: white; width: 30px; }
    </style>
</head>
<body>

    <div class="header-logo">دوست یابی</div>

    <div class="register-box">
        <div class="profile-pic" onclick="document.getElementById('fileInput').click()">👤</div>
        <input type="file" id="fileInput" hidden>

        <div class="input-wrapper">
            <input type="text" placeholder="نام و نام خانوادگی">
        </div>

        <div class="input-wrapper">
            <span class="prefix">+98</span>
            <input type="tel" placeholder="---- ---- ----">
        </div>
        
        <p style="color: #666; font-size: 0.8rem; margin-top: 10px;">لطفاً کشور خود را تأیید کرده و شماره تلفن خود را وارد کنید.</p>
    </div>

    <button class="fab-btn" onclick="alert('در حال ورود...')">
        <svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
    </button>

</body>
</html>
