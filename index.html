<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به برنامه دوستیابی</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lottie-web/build/player/lottie.min.js"></script>

  <style>
    :root {
      --bg1: #0f1020;
      --bg2: #151a3d;
      --card: rgba(255,255,255,0.10);
      --card-border: rgba(255,255,255,0.18);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.72);
      --accent: #ff4d8d;
      --accent2: #7c5cff;
      --shadow: 0 24px 80px rgba(0,0,0,0.35);
      --glass: blur(16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      color: var(--text);
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    /* Background glow decorations */
    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 1;
      opacity: 0.5;
    }
    .circle-1 {
      width: 150px;
      height: 150px;
      background: var(--accent);
      top: -30px;
      right: -30px;
    }
    .circle-2 {
      width: 180px;
      height: 180px;
      background: var(--accent2);
      bottom: -40px;
      left: -40px;
    }

    .card {
      position: relative;
      z-index: 2;
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      border-radius: 30px;
      padding: 30px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .lottie-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 10px;
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(to left, #fff, #ffcbdc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .input-group {
      text-align: right;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--muted);
      padding-right: 4px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
      text-align: right;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 15px rgba(255, 77, 141, 0.25);
    }

    .btn {
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 14px;
      padding: 15px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 25px rgba(255, 77, 141, 0.3);
      transition: all 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 77, 141, 0.45);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="card">
      <div class="lottie-container" id="lottie"></div>
      
      <h2>خوش آمدید</h2>
      <div class="subtitle">برای ورود به برنامه، مشخصات خود را وارد کنید</div>

      <form id="loginForm">
        <div class="input-group">
          <label for="name">نام و نام خانوادگی</label>
          <div class="input-wrapper">
            <input type="text" id="name" required placeholder="مثلاً: یاسین" />
          </div>
        </div>

        <div class="input-group">
          <label for="phone">شماره موبایل</label>
          <div class="input-wrapper">
            <input type="tel" id="phone" required placeholder="مثلاً: 09123456789" pattern="^(0?9)\d{9}$" title="لطفاً شماره موبایل معتبر وارد کنید" />
          </div>
        </div>

        <div class="input-group">
          <label for="profileId">آیدی پروفایل (اختیاری)</label>
          <div class="input-wrapper">
            <input type="text" id="profileId" placeholder="مثلاً: yasin_25" />
          </div>
        </div>

        <button class="btn" type="submit">ورود به برنامه</button>
      </form>

      <div class="note">
        با زدن دکمه ورود، اطلاعات شما در حافظه مرورگر ذخیره می‌شود.
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // بارگذاری انیمیشن لاتی
    lottie.loadAnimation({
      container: document.getElementById("lottie"),
      renderer: "svg",
      loop: true,
      autoplay: true,
      path: "https://assets10.lottiefiles.com/packages/lf20_touohxv0.json"
    });

    const form = document.getElementById("loginForm");
    const toast = document.getElementById("toast");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const nameVal = document.getElementById("name").value.trim();
      const phoneVal = document.getElementById("phone").value.trim();
      const profileIdVal = document.getElementById("profileId").value.trim();

      // ۱. ذخیره به صورت شیء تکی جهت هماهنگی با کدهای جدید شما
      const data = {
        name: nameVal,
        phone: phoneVal,
        profileId: profileIdVal,
        savedAt: new Date().toISOString()
      };
      localStorage.setItem("datingAppUser", JSON.stringify(data));

      // ۲. ذخیره به صورت کلیدهای مجزا جهت هماهنگی کامل با صفحه اصلی (main.html)
      localStorage.setItem('userData_name', nameVal);
      localStorage.setItem('userData_phone', phoneVal);

      // نمایش پیام موفقیت
      showToast("اطلاعات با موفقیت ذخیره شد ✨");

      // هدایت خودکار کاربر به صفحه اصلی (main.html) بعد از ۱.۵ ثانیه
      setTimeout(() => {
        window.location.href = 'main.html';
      }, 1500);
    });
  </script>
</body>
</html>
