<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیش ثبت نام اپلیکیشن</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f8f9fa; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .register-container { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 25px 25px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); position: absolute; bottom: 0; }
        
        /* استایل آواتار */
        .avatar-section { text-align: center; margin-bottom: 25px; }
        .avatar-circle { width: 90px; height: 90px; background: #e9ecef; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: 2px solid #dee2e6; transition: 0.3s; }
        .avatar-circle:hover { border-color: #007bff; }

        /* استایل اینپوت‌ها */
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: #007bff; outline: none; background: #fdfdfd; }

        /* استایل دکمه */
        .btn-submit { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { transform: scale(0.98); }
        
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>تکمیل اطلاعات</h2>
    
    <div class="avatar-section">
        <div class="avatar-circle" onclick="document.getElementById('imgUpload').click()">👤</div>
        <input type="file" id="imgUpload" hidden>
        <p style="font-size: 0.75rem; color: #888; margin-top: 5px;">انتخاب عکس پروفایل</p>
    </div>

    <div class="input-group">
        <label>نام و نام خانوادگی</label>
        <input type="text" placeholder="مثال: علی رضایی">
    </div>

    <div class="input-group">
        <label>شماره موبایل</label>
        <input type="tel" placeholder="09120000000" dir="ltr">
    </div>

    <button class="btn-submit" onclick="alert('اطلاعات ثبت شد!')">تایید و ورود</button>
</div>

</body>
</html>
