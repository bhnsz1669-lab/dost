<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اپلیکیشن دوستیابی</title>
    <style>
        /* تنظیمات پایه */
        body { font-family: Tahoma, sans-serif; background-color: #ffffff; margin: 0; padding-bottom: 90px; color: #111; transition: 0.4s; }
        body.dark-mode { background-color: #1a1a1a; color: #f1f1f1; }
        
        /* مدیریت صفحات */
        .page { display: none; padding: 20px; }
        #page-settings { display: block; } /* صفحه پیش‌فرض */
        
        /* نوار پایین صفحه */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 75px; background-color: #f8f9fa; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; z-index: 999; }
        body.dark-mode .bottom-nav { background-color: #222; border-top: 1px solid #444; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 12px; color: #555; }
        body.dark-mode .nav-item { color: #bbb; }
        .nav-item.active { color: #007bff; }

        /* لیست‌های منو */
        .menu-item { padding: 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.3s; }
        body.dark-mode .menu-item { border-bottom: 1px solid #333; }
        .menu-item:hover { background-color: rgba(0,0,0,0.05); }

        /* صفحه چت */
        .chat-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; flex-direction: column; }
        body.dark-mode .chat-container { background: #1a1a1a; }
        .chat-header { padding: 15px; background: #eee; display: flex; justify-content: space-between; align-items: center; }
        body.dark-mode .chat-header { background: #333; }
    </style>
</head>
<body>

    <div id="page-chats" class="page">
        <h1>گفتگوها</h1>
        <div onclick="openChat('نیکا')" class="menu-item">گفتگو با نیکا</div>
        <div onclick="openChat('علیرضا')" class="menu-item">گفتگو با علیرضا</div>
    </div>
    <div id="page-contacts" class="page"><h1>مخاطبین</h1><p>لیست دوستان شما در اینجا نمایش داده می‌شود.</p></div>
    <div id="page-settings" class="page">
        <h1>تنظیمات</h1>
        <div class="menu-item" onclick="document.body.classList.toggle('dark-mode')">🌙 تغییر تم (روز/شب)</div>
        <div class="menu-item">👤 ویرایش پروفایل</div>
        <div class="menu-item">📢 تنظیمات اعلان‌ها</div>
        <div class="menu-item">🔒 حریم خصوصی و امنیت</div>
    </div>
    <div id="page-profile" class="page"><h1>پروفایل</h1><p>اطلاعات کاربری شما.</p></div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="showPage('chats', this)"><span>💬</span>گفتگوها</div>
        <div class="nav-item" onclick="showPage('contacts', this)"><span>👥</span>مخاطبین</div>
        <div class="nav-item active" onclick="showPage('settings', this)"><span>⚙️</span>تنظیمات</div>
        <div class="nav-item" onclick="showPage('profile', this)"><span>👤</span>پروفایل</div>
    </div>

    <div id="chatPage" class="chat-container">
        <div class="chat-header">
            <span id="chatTitle"></span>
            <button onclick="closeChat()">بستن</button>
        </div>
        <div style="padding: 20px;">محیط چت...</div>
    </div>

    <script>
        let hasSubscription = true; // وضعیت اشتراک

        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page-' + pageId).style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        function openChat(name) {
            if (hasSubscription) {
                document.getElementById('chatTitle').innerText = 'گفتگو با ' + name;
                document.getElementById('chatPage').style.display = 'flex';
            } else {
                alert("لطفاً ابتدا اشتراک خود را خریداری کنید.");
            }
        }
        function closeChat() { document.getElementById('chatPage').style.display = 'none'; }
    </script>
</body>
</html>
