<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ورود به برنامه دوست یابی</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #0f1020;
      --bg2: #151a3d;
      --card: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.65);
      --accent: #ff4d8d;
      --accent2: #7c5cff;
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      --glass: blur(24px);
      --err: #ff5c7a;
    }

    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    body { background: linear-gradient(135deg, var(--bg1), var(--bg2)); display: flex; justify-content: center; align-items: center; padding: 16px; color: var(--text); font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }

    /* تمام استایل‌های اصلی شما حفظ شد */
    .wrapper { position: relative; width: 100%; max-width: 360px; margin: auto; display: flex; justify-content: center; align-items: center; transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1); }
    .wrapper.exit-anim { opacity: 0; transform: scale(0.95) translateY(-15px); pointer-events: none; }
    
    .card { position: relative; z-index: 2; width: 100%; background: var(--card); border: 1px solid var(--card-border); backdrop-filter: var(--glass); border-radius: 32px; padding: 30px 22px; text-align: center; }

    /* اصلاح لودینگ: لوگو ثابت در مرکز و اسپینر چرخنده دور آن */
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 11, 23, 0.3); backdrop-filter: blur(30px); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
    .loading-overlay.show { opacity: 1; pointer-events: auto; }
    
    .loading-container { position: relative; width: 130px; height: 130px; display: flex; justify-content: center; align-items: center; animation: floatEffect 3s ease-in-out infinite; }
    @keyframes floatEffect { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

    /* اسپینر دور لوگو */
    .modern-spinner { position: absolute; width: 130px; height: 130px; border: 4px solid transparent; border-top: 4px solid var(--accent); border-bottom: 4px solid var(--accent2); border-radius: 50%; animation: superSpin 1.5s linear infinite; box-shadow: 0 0 20px rgba(255, 77, 141, 0.3); }
    @keyframes superSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* لوگوی ثابت و درخشان در مرکز */
    .loading-logo { width: 70px; height: 70px; object-fit: contain; z-index: 10; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3)); }
    
    .loading-text { margin-top: 24px; font-size: 15px; font-weight: 700; color: white; opacity: 0.8; }
  </style>
</head>
<body>

  <div class="wrapper" id="pageWrapper">
    <div class="card" id="mainCard">
      <form id="loginForm">
        <button class="btn" type="submit">ورود به برنامه</button>
      </form>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-container">
      <div class="modern-spinner"></div>
      <img class="loading-logo" src="1000012320.png" alt="لوگو" />
    </div>
    <p class="loading-text">در حال ورود به برنامه...</p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const pageWrapper = document.getElementById("pageWrapper");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      // ... منطق اعتبارسنجی شما ...
      
      // اجرای صفحه لودینگ با تایمر ۵ ثانیه
      pageWrapper.classList.add("exit-anim");
      setTimeout(() => {
        loadingOverlay.classList.add("show");
        // زمان ۵ ثانیه برای نمایش شاهکار
        setTimeout(() => { 
          window.location.href = 'main.html'; 
        }, 5000); 
      }, 500);
    });
  </script>
</body>
</html>
