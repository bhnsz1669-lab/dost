<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل پروفایل</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }

        /* استایل کاردها */
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        /* بخش پروفایل */
        .profile-section { display: flex; flex-direction: column; align-items: center; }
        .avatar-box { width: 100px; height: 100px; border-radius: 50%; background: #f0f7ff; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid #007bff; overflow: hidden; margin-bottom: 10px; }
        #avatar-preview { width: 100%; height: 100%; object-fit: cover; }
        
        /* استایل لیبل و اینپوت */
        .label { font-size: 0.85rem; color: #666; margin-bottom: 5px; display: block; text-align: right; }
        .reg-input { width: 100%; padding: 15px; border: 1px solid #eee; border-radius: 15px; box-sizing: border-box; font-size: 15px; background: #f9f9f9; outline: none; transition: 0.3s; }
        .reg-input:focus { border-color: #007bff; background: white; }
        
        /* دکمه ثبت‌نام */
        .reg-btn { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,123,255,0.3); }
        .reg-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h2>تکمیل اطلاعات</h2>

    <div class="card profile-section">
        <div class="avatar-box" onclick="document.getElementById('file-input').click()">
            <img id="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
            <input type="file" id="file-input" hidden accept="image/*" onchange="preview(event)">
        </div>
        <span style="font-size: 0.8rem; color: #888;">انتخاب عکس پروفایل</span>
    </div>

    <div class="card">
        <span class="label">نام و نام خانوادگی</span>
        <input type="text" id="name" class="reg-input" placeholder="مثلاً: علی رضایی">
    </div>

    <div class="card">
        <span class="label">شماره تماس</span>
        <input type="tel" id="phone" class="reg-input" placeholder="09120000000">
    </div>
    
    <button class="reg-btn" onclick="register()">ورود به برنامه</button>
</div>

<script>
    function preview(e) {
        const reader = new FileReader();
        reader.onload = () => document.getElementById('avatar-preview').src = reader.result;
        reader.readAsDataURL(e.target.files[0]);
    }

    function register() {
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const avatar = document.getElementById('avatar-preview').src;

        if(name === "" || phone === "") {
            alert("لطفاً تمامی موارد را تکمیل کنید.");
            return;
        }

        localStorage.setItem('userName', name);
        localStorage.setItem('userPhone', phone);
        localStorage.setItem('userAvatar', avatar);

        window.location.href = "main.html";
    }
</script>

</body>
</html>
