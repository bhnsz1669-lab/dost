<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه دوست یابی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #A4BCE0; margin: 0; padding: 20px; color: #111; transition: 0.4s; }
        body.dark-mode { background-color: #1a1a1a; color: #f1f1f1; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 10px 0; }
        
        /* آیکون‌های هدر با قابلیت تغییر رنگ */
        .icon-btn { font-size: 1.5rem; cursor: pointer; color: #111; transition: 0.3s; }
        body.dark-mode .icon-btn { color: #fff; }

        .user-list { display: flex; flex-direction: row; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .user-item { flex: 0 0 auto; text-align: center; cursor: pointer; width: 65px; }
        .avatar { width: 65px; height: 65px; border-radius: 50%; background-color: #ddd; object-fit: cover; border: 2px solid white; }
        
        /* منوی تنظیمات کشویی */
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #fff; overflow-x: hidden; transition: 0.5s; padding-top: 60px; box-shadow: -2px 0 5px rgba(0,0,0,0.2); }
        body.dark-mode .side-menu { background-color: #333; }
        .side-menu button { display: block; width: 80%; margin: 10px auto; padding: 10px; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .box { background: white; width: 80%; max-width: 300px; padding: 20px; border-radius: 20px; text-align: center; color: #333; }
    </style>
</head>
<body>

    <div class="header">
        <div class="icon-btn" onclick="openNav()">⚙️</div>
        <div style="font-weight:bold;">دوست یابی</div>
        <div class="icon-btn" onclick="alert('خرید اشتراک')">🛒</div>
    </div>

    <div id="sideMenu" class="side-menu">
        <button onclick="closeNav()">بستن منو</button>
        <button onclick="document.body.classList.toggle('dark-mode')">تغییر تم (روز/شب)</button>
    </div>

    <div class="user-list">
        <div class="user-item" onclick="checkChat('نیکا')"><img class="avatar" src="user1.jpg"><div class="name">نیکا</div></div>
        <div class="user-item" onclick="checkChat('نازنین')"><img class="avatar" src="user2.jpg"><div class="name">نازنین</div></div>
        <div class="user-item" onclick="checkChat('علی رضا')"><img class="avatar" src="user3.jpg"><div class="name">علی رضا</div></div>
        <div class="user-item" onclick="checkChat('بهناز')"><img class="avatar" src="user4.jpg"><div class="name">بهناز</div></div>
        <div class="user-item" onclick="checkChat('رضا')"><img class="avatar" src="user5.jpg"><div class="name">رضا</div></div>
        <div class="user-item" onclick="checkChat('سارا')"><img class="avatar" src="user6.jpg"><div class="name">سارا</div></div>
        <div class="user-item" onclick="checkChat('امیر')"><img class="avatar" src="user7.jpg"><div class="name">امیر</div></div>
    </div>

    <div id="chatModal" class="modal">
        <div class="box">
            <h2 id="chatName">چت</h2>
            <button onclick="document.getElementById('chatModal').style.display='none'">بستن</button>
        </div>
    </div>

    <script>
        let hasSubscription = true; // برای تست روی true تنظیم شد

        function checkChat(name) {
            if (hasSubscription) {
                document.getElementById('chatName').innerText = 'گفتگو با ' + name;
                document.getElementById('chatModal').style.display = 'flex';
            } else {
                alert("لطفاً ابتدا اشتراک خود را خریداری کنید.");
            }
        }

        function openNav() { document.getElementById("sideMenu").style.width = "250px"; }
        function closeNav() { document.getElementById("sideMenu").style.width = "0"; }
    </script>
</body>
</html>
