<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیش‌ثبت‌نام | دوست‌یابی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');
        
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f0f2f5; margin: 0; color: #333; }

        /* هدر خاکستری تیره */
        .app-header { background: #2c3e50; padding: 25px 20px; display: flex; align-items: center; color: white; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .app-icon { width: 60px; height: 60px; border-radius: 15px; margin-left: 15px; background: white; }
        .title-group { display: flex; flex-direction: column; }
        .small-title { font-size: 0.75rem; opacity: 0.8; margin-bottom: -5px; }
        .main-title { font-size: 1.4rem; font-weight: 700; }

        /* فرم */
        .main-container { padding: 30px; }
        .profile-pic { width: 100px; height: 100px; background: white; border: 2px solid #ddd; border-radius: 50%; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        .input-box { background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .input-box input { width: 100%; border: none; outline: none; font-size: 1rem; font-family: 'Vazirmatn'; }

        /* دکمه آبی شناور */
        .fab { position: fixed; bottom: 30px; right: 30px; background: #007bff; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,123,255,0.4); border: none; transition: 0.3s; }
        
        /* لایه انتقال حرفه‌ای */
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-header">
        <img src="1000012320.png" class="app-icon" alt="icon">
        <div class="title-group">
            <span class="small-title">اپلیکیشن</span>
            <span class="main-title">دوست‌یابی</span>
        </div>
    </div>

    <div class="main-container">
        <div class="profile-pic" onclick="document.getElementById('fileInput').click()">
            <img id="preview" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="label">انتخاب عکس</span>
        </div>
        <input type="file" id="fileInput" hidden onchange="loadFile(event)">

        <div class="input-box"><input type="text" id="name" placeholder="نام و نام خانوادگی"></div>
        <div class="input-box"><input type="tel" id="phone" placeholder="شماره موبایل" maxlength="11"></div>
    </div>

    <button class="fab" onclick="processData()">➔</button>

    <div id="loader-overlay">
        <div class="spinner"></div>
        <p style="font-weight:bold;">در حال انتقال...</p>
    </div>

    <script>
        function loadFile(e) {
            const img = document.getElementById('preview');
            img.src = URL.createObjectURL(e.target.files[0]);
            img.style.display = 'block';
            document.getElementById('label').style.display = 'none';
        }

        function processData() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            if(!name || phone.length < 11) {
                alert("لطفاً اطلاعات را کامل و صحیح وارد کنید.");
                return;
            }

            // ذخیره اطلاعات
            localStorage.setItem('userName', name);
            localStorage.setItem('userPhone', phone);

            // نمایش صفحه انتقال
            document.getElementById('loader-overlay').style.display = 'flex';

            // هدایت به سایت اصلی (آدرس سایت اصلی خود را اینجا قرار دهید)
            setTimeout(() => {
                window.location.href = "https://your-main-site.com"; 
            }, 2500);
        }
    </script>
</body>
</html>
