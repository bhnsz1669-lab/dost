<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پیش ثبت نام</title>
  <style>
    :root {
      --bg: #121212;
      --accent: #d87093;
      --accent-2: #a13d61;
      --text: #ffffff;
      --muted: #9a9a9a;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 400px; padding: 20px; }
    
    /* استایل پروفایل و هدر */
    .header-box { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
    .profile-circle { width: 100px; height: 100px; border-radius: 50%; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; cursor: pointer; overflow: hidden; background: #1e1e1e; }
    
    /* لودر حرفه‌ای */
    #loader-overlay { position: fixed; inset: 0; background: rgba(18, 18, 18, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
    .spinner { width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* دکمه */
    .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <img src="1000012320.png" style="width:50px;" alt="Logo">
        <div>
            <div style="font-size: 0.7rem; color: var(--muted);">اپلیکیشن</div>
            <div style="font-size: 1.5rem; font-weight: bold;">دوست‌یابی</div>
        </div>
    </div>

    <div class="profile-circle" onclick="document.getElementById('fileInput').click()">
        <img id="preview" style="width:100%; height:100%; object-fit:cover; display:none;">
        <span id="labelTxt">انتخاب عکس</span>
    </div>
    <input type="file" id="fileInput" hidden accept="image/*" onchange="loadFile(event)">

    <input type="text" id="name" placeholder="نام و نام خانوادگی" style="width:100%; padding:10px; margin-bottom:10px; background:#1e1e1e; border:none; color:white; border-radius:8px;">
    <input type="tel" id="phone" placeholder="شماره تماس" style="width:100%; padding:10px; background:#1e1e1e; border:none; color:white; border-radius:8px;">
    
    <button class="submit-btn" onclick="saveAndRedirect()">ثبت نام و ادامه</button>
</div>

<div id="loader-overlay">
    <div class="spinner"></div>
    <div>در حال انتقال...</div>
</div>

<script>
    function loadFile(e) {
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(e.target.files[0]);
        preview.style.display = 'block';
        document.getElementById('labelTxt').style.display = 'none';
    }

    function saveAndRedirect() {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        
        if(!name || !phone) { alert("لطفا همه موارد را پر کنید"); return; }

        // ذخیره در مرورگر برای سایت اصلی
        localStorage.setItem('user_data', JSON.stringify({name, phone}));
        
        // نمایش لودر
        document.getElementById('loader-overlay').style.display = 'flex';
        
        // انتقال پس از 2 ثانیه
        setTimeout(() => {
            window.location.href = "https://your-main-site.com";
        }, 2000);
    }
</script>
</body>
</html>
