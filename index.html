<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام حرفه‌ای</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); text-align: center; }
        .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: #007bff; width: 33%; transition: 0.4s; }
        .input-field { width: 100%; border: none; border-bottom: 2px solid #ddd; padding: 12px 0; margin-bottom: 25px; font-size: 16px; outline: none; transition: 0.3s; }
        .input-field:focus { border-bottom: 2px solid #007bff; }
        .btn-next { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .avatar-box { width: 100px; height: 100px; background: #e9ecef; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px dashed #ccc; }
    </style>
</head>
<body>

<div class="card" id="onboarding">
    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
    
    <div id="step-1">
        <div class="avatar-box" onclick="document.getElementById('fileInput').click()">📷</div>
        <h2>عکس پروفایل</h2>
        <p style="color: #777;">یک عکس زیبا از خودت انتخاب کن</p>
        <button class="btn-next" onclick="nextStep(2)">مرحله بعد</button>
    </div>

    <div id="step-2" style="display:none;">
        <h2>اطلاعات پایه</h2>
        <input type="text" class="input-field" placeholder="نام و نام خانوادگی">
        <input type="tel" class="input-field" placeholder="شماره تماس">
        <button class="btn-next" onclick="nextStep(3)">مرحله بعد</button>
    </div>

    <div id="step-3" style="display:none;">
        <h2>کمی درباره خودت</h2>
        <textarea class="input-field" placeholder="بیوگرافی کوتاه..."></textarea>
        <button class="btn-next" onclick="finish()">شروع فعالیت</button>
    </div>
</div>

<input type="file" id="fileInput" hidden>

<script>
    function nextStep(step) {
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'none';
        document.getElementById('step-3').style.display = 'none';
        
        document.getElementById('step-' + step).style.display = 'block';
        document.getElementById('progress').style.width = (step * 33.3) + '%';
    }
    
    function finish() {
        alert("خوش آمدید! ثبت نام با موفقیت انجام شد.");
        window.location.href = "main.html"; // هدایت به صفحه اصلی سایت
    }
</script>

</body>
</html>
