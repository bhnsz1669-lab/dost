<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صفحه دوست یابی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; color: #111; transition: 0.3s; }
        body.dark-mode { background-color: #1a1a1a; color: #f1f1f1; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .icon { cursor: pointer; font-size: 1.5rem; }
        
        .user-list { display: flex; overflow-x: auto; gap: 15px; padding: 20px 0; }
        .user-item { text-align: center; cursor: pointer; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #ddd; object-fit: cover; }
        
        /* مودال‌ها */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 80%; max-width: 300px; text-align: center; color: #333; }
        
        body.dark-mode .modal-content { background: #333; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="icon" onclick="openSettings()">⚙️</div>
        <div style="font-weight:bold;">دوست یابی</div>
        <div class="icon" onclick="alert('به صفحه خرید اشتراک هدایت می‌شوید')">💎</div>
    </div>

    <div class="user-list">
        <div class="user-item" onclick="checkChat('نازنین')">
            <img src="user2.jpg" class="avatar">
            <div>نازنین</div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>تنظیمات</h3>
            <button onclick="document.body.classList.toggle('dark-mode')">تغییر تم (روز/شب)</button>
            <br><br>
            <button onclick="closeModal('settingsModal')">بستن</button>
        </div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content">
            <h3 id="chatTitle"></h3>
            <p>خوش آمدید!</p>
            <button onclick="closeModal('chatModal')">بستن</button>
        </div>
    </div>

    <script>
        let hasSubscription = false; // این متغیر وضعیت اشتراک است

        function checkChat(name) {
            if (hasSubscription) {
                document.getElementById('chatTitle').innerText = "چت با " + name;
                document.getElementById('chatModal').style.display = 'flex';
            } else {
                alert("لطفاً ابتدا اشتراک خود را خریداری کنید.");
            }
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
