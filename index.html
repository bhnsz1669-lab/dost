<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ورود</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* قفل کردن صفحه برای جلوگیری از تکان خوردن و جابجایی */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background: #0f0c20;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f1a3a, #0f0c20);
            perspective: 1000px; /* برای ایجاد عمق انیمیشن اندروید/آی‌او‌اس */
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); /* انیمیشن نرم خروج */
        }

        /* کلاسی که هنگام خروج و انتقال به دایره اعمال می‌شود */
        .container.exit-active {
            opacity: 0;
            transform: scale(0.9) translateY(30px);
            filter: blur(8px);
        }

        .header-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        /* بخش آیکون برنامه - دایره‌ای، درخشان و چندلایه */
        .app-icon-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .app-icon {
            width: 95px;
            height: 95px;
            background: radial-gradient(circle, rgba(255, 51, 102, 0.2) 0%, rgba(255, 255, 255, 0.05) 70%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff3366;
            font-size: 45px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.7), 
                        0 0 40px rgba(255, 174, 0, 0.5), 
                        0 0 60px rgba(255, 51, 102, 0.3),
                        inset 0 0 20px rgba(255, 255, 255, 0.4),
                        inset 0 0 10px rgba(255, 174, 0, 0.4);
            animation: crystal-glow 2s infinite alternate ease-in-out;
        }

        @keyframes crystal-glow {
            0% {
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.6), 0 0 30px rgba(255, 174, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
                border-color: rgba(255, 255, 255, 0.4);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 30px rgba(255, 51, 102, 0.9), 0 0 55px rgba(255, 174, 0, 0.7), inset 0 0 25px rgba(255, 255, 255, 0.5);
                border-color: rgba(255, 255, 255, 0.7);
                transform: scale(1.02);
            }
        }

        /* بخش پروفایل و انتخاب عکس بدون آیکون دوربین بنفش */
        .profile-upload-section {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .profile-avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            cursor: pointer;
        }

        .profile-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff3366;
            background: #333;
        }

        /* فیلدهای ورودی */
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 8px;
            padding-right: 5px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            text-align: right;
        }

        .input-field:focus {
            border-color: #ff3366;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        /* دکمه ارسال */
        .submit-btn {
            position: relative;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #ff3366, #ff5e62);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .submit-btn:hover {
            opacity: 0.9;
            box-shadow: 0 7px 20px rgba(255, 51, 102, 0.5);
        }

        /* استایل انیمیشن لودینگ چرخشی اندروید/آی‌او‌اس */
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container" id="main-card">
            
            <div class="app-icon-container">
                <div class="app-icon">❤️</div>
            </div>

            <h2 class="header-title">دوست یابی</h2>

            <div class="profile-upload-section">
                <div class="profile-avatar-wrapper" onclick="document.getElementById('file-input').click()">
                    <img id="avatar-img" class="profile-preview" src="default-avatar.png" alt="پروفایل">
                </div>
                <input type="file" id="file-input" accept="image/*" onchange="handleProfileUpload(event)">
            </div>

            <form id="main-form">
                
                <div class="input-group">
                    <label for="username">نام و نام خانوادگی</label>
                    <input type="text" id="username" class="input-field" placeholder="نام خود را وارد کنید" required>
                </div>

                <div class="input-group">
                    <label for="phone">شماره تلفن</label>
                    <input type="tel" id="phone" class="input-field" placeholder="0912XXXXXXX" style="direction: ltr; text-align: right;" required>
                </div>

                <div class="input-group">
                    <label for="userid">آیدی و پروفایل</label>
                    <input type="text" id="userid" class="input-field" placeholder="آیدی مورد نظر خود را وارد کنید" required>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span id="btn-text">ثبت نام و ورود</span>
                    <div class="spinner" id="btn-spinner"></div>
                </button>
            </form>

        </div>
    </div>

    <script>
        // اسکریپت مدیریت آپلود عکس
        function handleProfileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatar-img').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // انیمیشن حرفه‌ای انتقال به صفحه اصلی سایت پس از ثبت‌نام موفقیت‌آمیز
        document.getElementById('main-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const mainCard = document.getElementById('main-card');
            
            // ۱. تبدیل دکمه به لودینگ چرخشی شیک (Android/iOS Style)
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            
            // ۲. اجرای افکت محو شدن و جابجایی کارت پس از یک مکث کوتاه واقعی
            setTimeout(() => {
                mainCard.classList.add('exit-active');
                
                // ۳. انتقال نهایی کاربر به صفحه اصلی سایت شما پس از اتمام انیمیشن خروج
                setTimeout(() => {
                    // آدرس صفحه اصلی خودت رو جایگزین '/' کن (مثلا index.html یا آدرس سایتت)
                    window.location.href = 'index.html'; 
                }, 800); // زمان هماهنگ با انیمیشن CSS
                
            }, 1200); // زمان لودینگ اولیه دکمه
        });
    </script>

</body>
</html>
