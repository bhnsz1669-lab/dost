<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پیش ثبت نام</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --muted: #9a9a9a;
      --line: #3a3a3a;
      --accent: #d87093;
      --accent-2: #a13d61;
      --ok: #4caf50;
      --err: #ff5c7a;
      --focus: #7093d8;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Tahoma, Arial, sans-serif; display: flex; justify-content: center; padding: 24px 16px 100px; }
    .container { width: 100%; max-width: 420px; }
    
    /* استایل‌های هدر و پروفایل */
    .header-box { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .logo { width: 58px; height: 58px; object-fit: contain; }
    .app-name-small { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .main-header { font-size: 1.7rem; font-weight: 700; }
    .profile-circle { width: 100px; height: 100px; border-radius: 50%; background: var(--card); border: 2px dashed #333; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; cursor: pointer; }

    /* استایل اینپوت‌ها */
    .input-group { margin-bottom: 20px; }
    .label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.9rem; }
    .input-field { width: 100%; border: none; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); padding: 10px 0; outline: none; font-size: 1.05rem; }
    .error-message { display: none; margin-top: 6px; font-size: 0.78rem; color: var(--err); }
    
    /* کادر تلفن هماهنگ شده */
    .phone-wrapper { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; direction: ltr; }
    .phone-input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 1.05rem; }
    
    /* لودینگ و دکمه */
    .submit-btn-wide { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); height: 52px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; font-weight: 700; cursor: pointer; z-index: 100; }
    #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #121212; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
    .spin-logo { width: 80px; height: 80px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-box">
      <img src="1000012320.png" alt="Logo" class="logo">
      <div>
        <div class="app-name-small">اپلیکیشن</div>
        <div class="main-header">دوست‌یابی</div>
      </div>
    </div>

    <div class="profile-circle" onclick="document.getElementById('fileInput').click()">
      <span id="imgPlaceholder">انتخاب تصویر</span>
      <img id="profilePreview" style="width:100%; height:100%; border-radius:50%; display:none; object-fit:cover;">
    </div>
    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewImage(this)">

    <div class="input-group">
      <label class="label">نام شما</label>
      <input type="text" id="nameInput" class="input-field" dir="auto" placeholder="نام خود را وارد کنید">
      <div id="nameError" class="error-message">لطفاً نام خود را وارد کنید</div>
    </div>

    <div class="input-group">
      <label class="label">شماره تلفن</label>
      <div class="phone-wrapper" id="phoneWrapper">
        <span id="countryCode" style="color:var(--muted)">+98</span>
        <input type="tel" id="phoneInput" class="phone-input" placeholder="9xxxxxxxxx" oninput="validatePhoneUI()">
      </div>
      <div id="phoneError" class="error-message">شماره تلفن معتبر نیست</div>
    </div>
  </div>

  <button class="submit-btn-wide" onclick="validateForm()">ثبت نام</button>

  <div id="loading-overlay">
    <img src="1000012320.png" class="spin-logo" alt="Loading...">
  </div>

  <script>
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('profilePreview').src = e.target.result;
          document.getElementById('profilePreview').style.display = 'block';
          document.getElementById('imgPlaceholder').style.display = 'none';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function validatePhoneUI() {
      const val = document.getElementById('phoneInput').value.trim();
      const phoneRegex = /^(0?9)\d{9}$/;
      const wrapper = document.getElementById('phoneWrapper');
      
      if (phoneRegex.test(val)) {
        wrapper.style.borderBottomColor = 'var(--ok)';
        document.getElementById('phoneError').style.display = 'none';
      } else {
        wrapper.style.borderBottomColor = 'var(--err)';
        document.getElementById('phoneError').style.display = 'block';
      }
    }

    function validateForm() {
      const name = document.getElementById('nameInput').value;
      const phone = document.getElementById('phoneInput').value;
      const phoneRegex = /^(0?9)\d{9}$/;

      if(name.trim() === "" || !phoneRegex.test(phone)) {
        alert("لطفاً تمامی اطلاعات را به درستی وارد کنید");
        return;
      }

      // ذخیره اطلاعات
      localStorage.setItem('userData_name', name);
      localStorage.setItem('userData_phone', phone);
      const img = document.getElementById('profilePreview').src;
      if(img.startsWith('data:image')) localStorage.setItem('userData_img', img);

      // نمایش لودینگ و هدایت
      document.getElementById('loading-overlay').style.display = 'flex';
      setTimeout(() => {
        window.location.href = 'main.html';
      }, 2000);
    }
  </script>
</body>
</html>
